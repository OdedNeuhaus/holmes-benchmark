[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holmes-benchmark"
version = "0.1.0"
description = "Concurrent HolmesGPT benchmarks with JSON and Excel reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "openpyxl>=3.1,<4", "rich>=13.7,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
holmes-benchmark = "holmes_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
